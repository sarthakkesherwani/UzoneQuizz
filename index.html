<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="description" content="UzoneQuiz — premium quiz management for teachers and students.">
  <title>UzoneQuiz — Learn. Test. Level up.</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script
    src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.0/dist/index.global.js"
    integrity="sha384-nWTzRTCY/9V4Bo352ehygr1c4cnst4XN6lMR3fipakEQrhVpc0hEM5Dii3Amz0sT"
    crossorigin="anonymous"
  ></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script>
    const savedTheme = localStorage.getItem('uzone-studio-theme');
    document.documentElement.classList.toggle('dark', savedTheme === 'dark' || savedTheme === 'aurora');
    document.documentElement.classList.toggle('aurora', savedTheme === 'aurora');
    if (savedTheme === 'aurora') window.addEventListener('DOMContentLoaded', () => window.UzoneAurora?.start());
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="aurora.css">
  <link rel="stylesheet" href="coding.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div id="boot-loader" class="boot-loader" aria-label="Loading UzoneQuiz">
    <div class="loader-logo"><span>U</span></div>
    <div class="loader-word">Uzone<span>Quiz</span></div>
    <div class="loader-track"><i></i></div>
  </div>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="api.js"></script>
  <script src="question-bank.js"></script>
  <script src="aurora.js"></script>
  <script src="app.js"></script>
  <script src="coding-harness.js"></script>
  <script src="coding-problems.js"></script>
  <script src="coding.js"></script>
</body>
</html>
